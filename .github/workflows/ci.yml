name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pixiv-ci-${{ github.workflow }}-${{ github.ref }}-${{ matrix.node }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Use supported npm
        run: npm install --global npm@11.19.0

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify install-script approvals
        run: npm install-scripts ls

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package output
        run: |
          test -f dist/index.mjs
          test -f dist/snowluma.mjs
          test -f dist/package.json
          node -e "const p=require('./dist/package.json'); if(p.main!=='index.mjs'||p.license!=='AGPL-3.0-only') process.exit(1)"
